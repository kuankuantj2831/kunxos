name: CI

on:
  push:
  pull_request:

env:
  TARGET: riscv64gc-unknown-none-elf

jobs:
  build:
    name: build / test / fmt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.TARGET }}
          components: rustfmt

      # kunxcore 用 include_bytes! 内嵌 kunxcore/kosdisk.img；*.img 被 .gitignore
      # 忽略，干净检出里没有它，须按 Makefile 的 `kosdisk` 目标先生成。
      - name: Generate embedded KOS volume
        run: |
          set -euo pipefail
          cargo build --manifest-path kos/Cargo.toml --bin kosctl
          KOSCTL="$PWD/kos/target/debug/kosctl"
          echo "KOS volume seeded by CI" > /tmp/kos-seed.txt
          "$KOSCTL" mkfs kunxcore/kosdisk.img.tmp 1024
          "$KOSCTL" put kunxcore/kosdisk.img.tmp /seed.txt /tmp/kos-seed.txt
          mv kunxcore/kosdisk.img.tmp kunxcore/kosdisk.img

      - name: cargo build
        run: |
          set -euo pipefail
          # 只对裸机目标编译发布物 crate。宿主 crate（默认 feature 依赖 std，
          # 裸机 target 编不过）按目录排除，其中部分在下方 cargo test 步骤
          # 以宿主目标编译验证：
          # - kos：对象存储格式库（test 清单内）
          # - apps/browser/hosttest：TLS 客户端宿主测试 bin（test 清单内）
          # - tools/sfs_host_test：SFS 内核源 include 宿主测试（test 清单内）
          # - tests/text_host：l10n 宿主测试（test 清单内）
          # - tools/kunxverify、tests/weather_json：手动宿主工具
          HOST_CRATES='^(kos|tests|tools)/|/hosttest/'
          for m in $(git ls-files '**/Cargo.toml' | grep -Ev "$HOST_CRATES"); do
            echo "==> cargo build $m"
            cargo build --release --target "$TARGET" --manifest-path "$m"
          done

      - name: cargo test (host-testable crates only)
        run: |
          set -euo pipefail
          # 宿主可测 crate 清单：裸机 no_std bin（自定义 linker）与含目标架构
          # 内联汇编的 crate（kunxhal/kunxcore）无法在宿主跑 libtest，只对
          # 纯逻辑 crate 运行 cargo test：
          # - shared/jpeg：JPEG 编码器
          # - wireless：Wi-Fi（扫描/连接/4-way/SAE/802.1X）与蓝牙（HCI/L2CAP/
          #   ATT/GATT/SMP/RFCOMM/HFP/A2DP）协议栈，QEMU 逻辑测试（模拟扫描等）
          # - kos：对象存储磁盘格式 / Merkle 校验 / 篡改检测（宿主可测设计）
          # - apps/browser/hosttest：TLS 1.2 客户端宿主测试 bin（无 #[test]，
          #   借此步做宿主编译检查）
          # - tests/text_host：shared/l10n 宿主测试 bin（同上，编译检查）
          # - tools/sfs_host_test：include 内核 fs_simple.rs 真源的掉电/并发/
          #   撕裂宿主测试（同上；真跑需生成测试盘，见 tools/mkfs_sfs.py）
          for m in shared/jpeg/Cargo.toml wireless/Cargo.toml kos/Cargo.toml kunxsec/Cargo.toml sync_tests/Cargo.toml tests/font_startup_host/Cargo.toml apps/browser/hosttest/Cargo.toml tests/text_host/Cargo.toml tools/sfs_host_test/Cargo.toml; do
            echo "==> cargo test $m"
            cargo test --manifest-path "$m"
          done

      - name: Run host regression programs
        run: |
          set -euo pipefail
          python3 docs/audit-2026-11-14-repro.py
          python3 docs/audit-2026-11-15-repro.py
          cargo run --manifest-path tests/text_host/Cargo.toml
          cargo run --manifest-path tests/weather_json/Cargo.toml
          python3 tools/mkfs_sfs.py rootfs /tmp/kunxos-audit-sfs.img 4096
          cargo run --manifest-path tools/sfs_host_test/Cargo.toml -- "" /tmp/kunxos-audit-sfs.img
          rustc --edition=2021 --target "$TARGET" -C panic=abort -C opt-level=2 \
            -C link-arg=-Tapps/probe/linker.ld -C link-arg=-z \
            -C link-arg=max-page-size=0x1000 tests/audit_guest.rs -o /tmp/kunxos-audit-guest
          rustc --edition=2021 --target "$TARGET" -C panic=abort -C opt-level=2 \
            -C link-arg=-Tapps/probe/linker.ld -C link-arg=-z \
            -C link-arg=max-page-size=0x1000 tests/audit_second_guest.rs -o /tmp/kunxos-audit-second-guest

      - name: Check test harness and packaged guest architecture
        run: |
          python3 -m compileall -q tests/scripts tools/kunxrepo
          python3 tests/scripts/test_qemu_test.py

      - name: Install RISC-V QEMU
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y qemu-system-misc
          # 新版 Ubuntu（qemu 10.x）把 riscv64 拆到独立的 qemu-system-riscv 包。
          if ! command -v qemu-system-riscv64 >/dev/null; then
            sudo apt-get install -y qemu-system-riscv
          fi
          qemu-system-riscv64 --version

      - name: Run RISC-V guest regressions
        run: |
          set -euo pipefail
          python3 tests/scripts/smoke_test.py --build-dir build/test-riscv
          python3 tests/scripts/browser_test.py --build-dir build/test-riscv

      # 代码尚未全量按 rustfmt 格式化，fmt 检查暂作非阻塞参考。
      - name: cargo fmt --check
        continue-on-error: true
        run: |
          set -euo pipefail
          for m in $(git ls-files '**/Cargo.toml'); do
            echo "==> cargo fmt --check $m"
            cargo fmt --check --manifest-path "$m"
          done

      # lint.sh 对任何 warning 都返回非零，暂作非阻塞参考。
      - name: lint.sh
        continue-on-error: true
        run: bash tools/lint.sh
