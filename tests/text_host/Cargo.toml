[package]
name = "text_host"
version = "0.1.0"
edition = "2021"

[dependencies]
rustybuzz = { version = "0.20", default-features = false }
unicode-bidi = { version = "0.3", default-features = false, features = ["hardcoded-data"] }
unicode-linebreak = "0.1"
unicode-script = "0.5"
fontdue = "0.9.4"
miniz_oxide = { version = "0.8", default-features = false, features = ["with-alloc"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

[lints.rust]
unused_unsafe = "allow"
unsafe_op_in_unsafe_fn = "allow"
