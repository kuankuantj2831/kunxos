[package]
name = "kos"
version = "0.1.0"
edition = "2021"
description = "KOS: KunxOS Object Storage — 磁盘格式 / 哈希 / Merkle 树 / 块设备抽象（Phase 1 Step 1，宿主可测）"

[features]
default = ["std", "sign"]
std = []
# kosctl 签名命令开关；kunxsec 同时提供必需的 SHA-256/CRC，始终依赖。
# 内核 default-features=false 不启用签名命令。
sign = []

[dependencies]
kunxsec = { path = "../kunxsec" }

[dev-dependencies]
criterion = "0.5"

[[bin]]
name = "kosctl"
required-features = ["std"]

[[bench]]
name = "hash"
harness = false

[[bench]]
name = "merkle"
harness = false
