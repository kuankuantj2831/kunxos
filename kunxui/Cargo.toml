[package]
name = "kunxui"
version = "0.1.0"
edition = "2021"
description = "KunxOS 星辰之光 UI 控件库：亮度滑块 / 星辰开关 / 星尘输入框"

[dependencies]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"

[lints.rust]
unused_unsafe = "allow"
unsafe_op_in_unsafe_fn = "allow"
