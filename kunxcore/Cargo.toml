[package]
name = "rust-kernel"
version = "0.1.0"
edition = "2021"

[features]
default = ["qemu"]
qemu = ["kunxhal/qemu"]
pi4 = ["kunxhal/pi4"]

[dependencies]
fontdue = "0.9.4"
kunxhal = { path = "../kunxhal", default-features = false }
kunxwireless = { path = "../wireless" }
kunxsec = { path = "../kunxsec" }

# 裸机环境：panic 直接中止，不展开栈（无 unwinding 支持）
[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = 2
# fat LTO 曾因 global_asm! 内的 fsd/fld（需 D 扩展）在 LTO 重汇编时被拒而
# 关闭；现 FP 现场保存已移入 inline asm! 辅助函数（trap_save_fp/
# trap_restore_fp，走 LLVM 代码生成不受限），global_asm 无浮点指令，恢复
# LTO 换回跨 crate 内联（启动阶段实测 -30% 差距的主要来源）。
lto = true

[lints.rust]
unused_unsafe = "allow"
unsafe_op_in_unsafe_fn = "allow"
