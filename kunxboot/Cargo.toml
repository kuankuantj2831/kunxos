[package]
name = "kunxboot"
version = "0.1.0"
edition = "2021"

[features]
default = ["qemu"]
qemu = []
pi4 = []

[dependencies]
kunxsec = { path = "../kunxsec" }

# 裸机环境：panic 直接中止，不展开栈（无 unwinding 支持）
[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = 2
lto = true
# 磁盘上的 MBR/BPB/目录项/FAT/DTB 全是不可信输入，整数下溢/回绕必须显式
# panic 而非静默回绕成无界读（bootloader 体积与性能不敏感）。
# 注意：debug-assertions 不可开启——它会激活 ptr::copy_nonoverlapping 等
# unsafe 前置条件的运行期检查，在 -O2+LTO 下与裸机流程冲突（实测 DTB walk
# 被破坏，boot 挂死）。
overflow-checks = true

[lints.rust]
unused_unsafe = "allow"
unsafe_op_in_unsafe_fn = "allow"
